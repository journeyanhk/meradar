<!DOCTYPE html>
<html lang="zh" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Meme 雷达</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span> Meme 雷达
      <span id="conn" class="conn off" title="实时连接状态"></span>
    </div>
    <button id="paperBtn" class="ghost" aria-label="纸面回报" title="纸面回报（只读模拟）">📄</button>
    <button id="themeBtn" class="ghost" aria-label="切换主题">🌓</button>
  </header>

  <section class="stats" id="stats">
    <div class="stat"><b id="s-total">–</b><span>候选</span></div>
    <div class="stat"><b id="s-24h">–</b><span>24h新增</span></div>
    <div class="stat t1"><b id="s-t1">–</b><span>T1动量</span></div>
    <div class="stat t2"><b id="s-t2">–</b><span>T2爆发</span></div>
    <div class="stat t3"><b id="s-t3">–</b><span>T3催化</span></div>
    <div class="stat"><b id="s-missed">–</b><span>漏杀</span></div>
  </section>

  <section class="filters">
    <label>链
      <select id="fChain">
        <option value="all">全部</option>
      </select>
    </label>
    <label>最低流动性
      <select id="fMinLiq">
        <option value="0">全部</option>
        <option value="5000">$5K</option>
        <option value="50000">$50K</option>
        <option value="200000">$200K</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="fEntry" /> 只看可试仓</label>
    <label class="chk"><input type="checkbox" id="fT2" /> 只看 T2+</label>
    <label class="chk"><input type="checkbox" id="fPause" /> 暂停滚动</label>
  </section>

  <main id="feed" class="feed"><div class="empty" id="empty">等待新币信号…（确保后端已连上 RPC）</div></main>

  <footer class="foot">只读监控 · 非投资建议 · 人工复核后自行决策</footer>

  <div id="paperOverlay" class="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <b>纸面回报 · 只读模拟</b>
        <button id="paperClose" class="ghost" aria-label="关闭">✕</button>
      </div>
      <div class="panel-sub" id="paperSub"></div>
      <div class="panel-body" id="paperBody">加载中…</div>
      <div class="panel-note">名义 $100 · horizon 24h · 往返成本按池费率扣除。中位收益/胜率/Rug率/2×率基于已平仓仓位，样本少时仅供参考。对照组为全体的哈希抽样子集。</div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
